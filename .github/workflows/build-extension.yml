name: Build browser extension package

on:
  workflow_call:
    inputs:
      extension-root:
        description: Path to the extension root containing manifest.json.
        required: true
        type: string
      zip-name:
        description: Stable filename for the ZIP archive.
        required: true
        type: string
      artifact-name:
        description: Name of the uploaded GitHub Actions artifact.
        required: true
        type: string

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ZIP
        id: build
        uses: md2it/browser-extension-ci-cd@v1.2.0
        with:
          extension-root: ${{ inputs.extension-root }}
          output-zip: ${{ runner.temp }}/${{ inputs.zip-name }}

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.build.outputs.zip-path }}
          retention-days: 7
          if-no-files-found: error
