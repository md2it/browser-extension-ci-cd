name: Release browser extension

on:
  workflow_call:
    inputs:
      extension-root:
        description: Path to the extension root containing manifest.json.
        required: true
        type: string
      zip-name:
        description: Stable filename for the release ZIP archive.
        required: true
        type: string
      changelog-path:
        description: Path to the Markdown changelog in the calling repository.
        required: true
        type: string
      chrome-extension-id:
        description: Chrome Web Store extension ID.
        required: false
        type: string
      chrome-publisher-id:
        description: Chrome Web Store publisher ID.
        required: false
        type: string
      store-upload-enabled:
        description: Explicit product opt-in; must be true together with repository variable STORE_UPLOAD_ENABLED=true.
        required: false
        type: string
      store-publish-enabled:
        description: Explicit product opt-in for store submission after upload/validation.
        required: false
        type: string
      amo-addon-id:
        description: AMO add-on ID, slug, or GUID.
        required: false
        type: string
    secrets:
      chrome-service-account-json:
        description: Google service-account JSON for Chrome Web Store API.
        required: false
      amo-jwt-issuer:
        description: AMO JWT issuer.
        required: false
      amo-jwt-secret:
        description: AMO JWT secret.
        required: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate tag, manifest, and inputs
        env:
          EXTENSION_ROOT: ${{ inputs.extension-root }}
          ZIP_NAME: ${{ inputs.zip-name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release workflow requires a tag in vX.Y.Z format; received ${GITHUB_REF_NAME:-unknown}."
            exit 1
          fi

          if [[ ! "$ZIP_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.zip$ ]]; then
            echo "::error::zip-name must be a stable .zip filename without path separators; received $ZIP_NAME."
            exit 1
          fi

          manifest="$EXTENSION_ROOT/manifest.json"
          if [[ ! -f "$manifest" ]]; then
            echo "::error::manifest.json not found at $manifest."
            exit 1
          fi

          node - "$manifest" "${GITHUB_REF_NAME#v}" <<'NODE'
          const [manifestPath, tagVersion] = process.argv.slice(2);
          let manifest;
          try {
            manifest = JSON.parse(require("node:fs").readFileSync(manifestPath, "utf8"));
          } catch (error) {
            console.error(`::error::manifest.json is invalid: ${error.message}`);
            process.exit(1);
          }
          if (manifest.version !== tagVersion) {
            console.error(`::error::Tag version ${tagVersion} does not match manifest version ${manifest.version ?? "(missing)"}.`);
            process.exit(1);
          }
          NODE

      - name: Check out central CI/CD helper
        uses: actions/checkout@v7
        with:
          repository: md2it/browser-extension-ci-cd
          ref: v1.4.3
          path: .central-ci-cd

      - name: Extract release notes from changelog
        env:
          CHANGELOG_PATH: ${{ inputs.changelog-path }}
        shell: bash
        run: |
          set -euo pipefail
          changelog="$CHANGELOG_PATH"
          version="${GITHUB_REF_NAME#v}"
          node .central-ci-cd/scripts/extract-changelog-section.mjs "$changelog" "$version" > "$RUNNER_TEMP/release-notes.md"

      - name: Build release ZIP
        id: build
        uses: md2it/browser-extension-ci-cd@v1.4.3
        with:
          extension-root: ${{ inputs.extension-root }}
          output-zip: ${{ runner.temp }}/${{ inputs.zip-name }}

      - name: Create published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.build.outputs.zip-path }}
          ZIP_NAME: ${{ inputs.zip-name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$ZIP_PATH#$ZIP_NAME" \
            --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Preserve release notes for store jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

  chrome-upload:
    name: Upload to Chrome Web Store
    needs: release
    if: ${{ inputs.store-upload-enabled == 'true' && vars.STORE_UPLOAD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate Chrome upload configuration
        env:
          CHROME_ID: ${{ inputs.chrome-extension-id }}
          CHROME_PUBLISHER_ID: ${{ inputs.chrome-publisher-id }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.chrome-service-account-json }}
        run: |
          set -euo pipefail
          [[ -n "$CHROME_ID" ]] || { echo '::error::chrome-extension-id is required when store upload is enabled.'; exit 1; }
          [[ -n "$CHROME_PUBLISHER_ID" ]] || { echo '::error::chrome-publisher-id is required when store upload is enabled.'; exit 1; }
          [[ -n "$SERVICE_ACCOUNT_JSON" ]] || { echo '::error::chrome-service-account-json secret is required before any API request.'; exit 1; }

      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: md2it/browser-extension-ci-cd
          ref: v1.4.3
          path: .central-ci-cd
      - name: Download ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ inputs.zip-name }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP_NAME" --dir "$RUNNER_TEMP/store-upload"
      - name: Upload ZIP draft and verify status
        env:
          CHROME_EXTENSION_ID: ${{ inputs.chrome-extension-id }}
          CHROME_PUBLISHER_ID: ${{ inputs.chrome-publisher-id }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.chrome-service-account-json }}
          ZIP_PATH: ${{ runner.temp }}/${{ 'store-upload' }}/${{ inputs.zip-name }}
        run: node .central-ci-cd/scripts/chrome-webstore-upload.mjs "$ZIP_PATH"

  chrome-publish:
    name: Submit Chrome version for review
    needs: chrome-upload
    if: ${{ inputs.store-publish-enabled == 'true' && vars.STORE_PUBLISH_ENABLED == 'true' && inputs.store-upload-enabled == 'true' && vars.STORE_UPLOAD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: md2it/browser-extension-ci-cd
          ref: v1.4.3
          path: .central-ci-cd
      - name: Validate Chrome publish configuration
        env:
          CHROME_ID: ${{ inputs.chrome-extension-id }}
          CHROME_PUBLISHER_ID: ${{ inputs.chrome-publisher-id }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.chrome-service-account-json }}
        run: |
          set -euo pipefail
          [[ -n "$CHROME_ID" && -n "$CHROME_PUBLISHER_ID" && -n "$SERVICE_ACCOUNT_JSON" ]] || { echo '::error::Chrome publish requires IDs and chrome-service-account-json.'; exit 1; }
      - name: Publish Chrome item for review
        env:
          CHROME_EXTENSION_ID: ${{ inputs.chrome-extension-id }}
          CHROME_PUBLISHER_ID: ${{ inputs.chrome-publisher-id }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.chrome-service-account-json }}
        run: node .central-ci-cd/scripts/chrome-webstore-publish.mjs

  amo-upload:
    name: Upload and validate AMO package
    needs: release
    if: ${{ inputs.store-upload-enabled == 'true' && vars.STORE_UPLOAD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: md2it/browser-extension-ci-cd
          ref: v1.4.3
          path: .central-ci-cd
      - name: Validate AMO configuration before any API request
        env:
          AMO_ADDON_ID: ${{ inputs.amo-addon-id }}
          AMO_JWT_ISSUER: ${{ secrets.amo-jwt-issuer }}
          AMO_JWT_SECRET: ${{ secrets.amo-jwt-secret }}
          EXTENSION_ROOT: ${{ inputs.extension-root }}
        run: |
          set -euo pipefail
          [[ -n "$AMO_ADDON_ID" ]] || { echo '::error::AMO_ADDON_ID is required when AMO upload is enabled.'; exit 1; }
          [[ -n "$AMO_JWT_ISSUER" ]] || { echo '::error::AMO_JWT_ISSUER secret is required when AMO upload is enabled.'; exit 1; }
          [[ -n "$AMO_JWT_SECRET" ]] || { echo '::error::AMO_JWT_SECRET secret is required when AMO upload is enabled.'; exit 1; }
          node - "$EXTENSION_ROOT/manifest.json" "$AMO_ADDON_ID" "${GITHUB_REF_NAME#v}" <<'NODE'
          const [manifestPath, addonId, tagVersion] = process.argv.slice(2);
          const manifest = JSON.parse(require('node:fs').readFileSync(manifestPath, 'utf8'));
          if (manifest.version !== tagVersion) throw new Error(`manifest version ${manifest.version} does not match tag ${tagVersion}`);
          const manifestId = manifest.browser_specific_settings?.gecko?.id;
          if (!manifestId) throw new Error('manifest browser_specific_settings.gecko.id is required for AMO automation');
          if (manifestId !== addonId) throw new Error(`manifest Gecko ID ${manifestId} does not match AMO_ADDON_ID`);
          NODE
      - name: Download ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ inputs.zip-name }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP_NAME" --dir "$RUNNER_TEMP/store-upload"
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes
      - name: Upload and validate AMO
        env:
          ZIP_PATH: ${{ runner.temp }}/store-upload/${{ inputs.zip-name }}
          AMO_ADDON_ID: ${{ inputs.amo-addon-id }}
          AMO_JWT_ISSUER: ${{ secrets.amo-jwt-issuer }}
          AMO_JWT_SECRET: ${{ secrets.amo-jwt-secret }}
          STORE_PUBLISH_ENABLED: ${{ inputs.store-publish-enabled }}
          REPOSITORY_STORE_PUBLISH_ENABLED: ${{ vars.STORE_PUBLISH_ENABLED }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes/release-notes.md
        run: node .central-ci-cd/scripts/amo-upload.mjs
